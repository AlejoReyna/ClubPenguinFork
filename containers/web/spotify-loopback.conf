# Lab only: reuse an already registered Spotify redirect (http://127.0.0.1:1455/spotify/callback)
# by bouncing it to the same-origin callback, where the session cookie lives.
# Run with scripts/glaciar-dev-puffle.py --spotify-redirect http://127.0.0.1:1455/spotify/callback
server {
    listen 1455;
    server_name _;
    access_log off;  # the query carries the OAuth authorization code
    location = /spotify/callback {
        limit_except GET { deny all; }
        add_header Cache-Control 'no-store' always;
        add_header Referrer-Policy 'no-referrer' always;
        return 302 http://$host:8080/puffle/spotify/callback$is_args$args;
    }
    location / { return 404; }
}
