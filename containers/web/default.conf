server {
    listen 8080;
    server_name _;
    root /srv/play;
    index index.html;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_max_body_size 32k;

    location = /healthz { return 200 'ok'; }
    location ~ ^/(index|register)\.html$ { add_header Cache-Control 'no-store'; }
    location = /sw.js { add_header Cache-Control 'no-store'; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control 'no-store';
    }
    location /icons/ { add_header Cache-Control 'public, max-age=604800'; }
    location /media/ { alias /srv/media/; }
    location /ruffle/ { alias /srv/ruffle/; }
    location /play/v2/ { alias /srv/media/play/v2/; }
    location /v2/ { alias /srv/media/play/v2/; }
    location /web_service/ {
        try_files /es$uri $uri =404;
    }
    location = /media/servers.xml {
        default_type application/xml;
        add_header Cache-Control 'no-store';
        return 200 '<?xml version="1.0"?><servers><environment name="live"><login address="$host" port="6112"/><redemption address="$host" port="9876"/><language locale="es"><server id="3101" name="Glaciar" safe="false" address="$host" port="9876"/></language><language locale="en"><server id="3101" name="Glaciar" safe="false" address="$host" port="9876"/></language></environment></servers>';
    }
    location = /servers.xml { rewrite ^ /media/servers.xml last; }
    location /create/legacy/ {
        proxy_pass http://dash:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /create_account/create_account.php {
        proxy_pass http://dash:3000/create/legacy/;
    }
    location /socket/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 3600s;
    }
}
