server {
    listen 8080;
    server_name _;
    root /srv/play;
    index index.html;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_max_body_size 32k;

    location = /healthz { return 200 'ok'; }
    location = /puffle { return 302 /puffle/; }
    location ~ ^/puffle/api/(pair|pair-status|confirm|disconnect|poll|active|result)$ {
        limit_except POST { deny all; }
        proxy_pass http://puffle:9103;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Access-Control-Allow-Origin;
        access_log off;
        add_header Cache-Control 'no-store';
    }
    # Lab server-side device (production/puffle/host.py, same container as the broker).
    # The browser only gets an HttpOnly cookie; Origin is checked by the service.
    location ~ ^/puffle/(api/session/(pair|status|confirm|disconnect)|spotify/(connect|disconnect))$ {
        limit_except POST { deny all; }
        proxy_pass http://puffle:9104;
        proxy_set_header Host $http_host;
        proxy_hide_header Access-Control-Allow-Origin;
        access_log off;
        add_header Cache-Control 'no-store';
    }
    location = /puffle/spotify/callback {
        limit_except GET { deny all; }
        proxy_pass http://puffle:9104;
        proxy_set_header Host $http_host;
        access_log off;  # the query carries the OAuth authorization code
        add_header Cache-Control 'no-store';
        add_header Referrer-Policy 'no-referrer';
    }
    location /puffle/api/ { return 404; }
    location /internal/ { return 404; }
    location ~ ^/(index|register)\.html$ { add_header Cache-Control 'no-store'; }
    location = /sw.js { add_header Cache-Control 'no-store'; }
    location = /media/play/v2/client/engine.swf {
        alias /srv/media/play/v2/client/engine.swf;
        add_header Cache-Control 'no-store';
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control 'no-store';
    }
    location /icons/ { add_header Cache-Control 'public, max-age=604800'; }
    location /media/ { alias /srv/media/; }
    location /ruffle/ { alias /srv/ruffle/; }
    location /play/v2/ { alias /srv/media/play/v2/; }
    location /v2/ { alias /srv/media/play/v2/; }
    location /web_service/ {
        try_files /es$uri $uri =404;
    }
    location = /media/servers.xml {
        default_type application/xml;
        add_header Cache-Control 'no-store';
        return 200 '<?xml version="1.0"?><servers><environment name="live"><login address="$host" port="6112"/><redemption address="$host" port="9876"/><language locale="es"><server id="3101" name="Glaciar" safe="false" address="$host" port="9876"/></language><language locale="en"><server id="3101" name="Glaciar" safe="false" address="$host" port="9876"/></language></environment></servers>';
    }
    location = /servers.xml { rewrite ^ /media/servers.xml last; }
    location /create/legacy/ {
        proxy_pass http://dash:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /create_account/create_account.php {
        proxy_pass http://dash:3000/create/legacy/;
    }
    location /socket/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 3600s;
    }
}
